# ============================================================
# React Weather Forecasting App
# Continuous Integration Workflow
#
# Purpose:
# Automatically validate the React application whenever
# relevant code is pushed or proposed through a Pull Request.
#
# STEP 5 CI Checks:
#   1. Check out repository source code
#   2. Configure Node.js
#   3. Install exact locked dependencies
#   4. Run ESLint
#   5. Create a production build
#
# Author: mghazel
# Date: 31-Aug-2026
# Version: 1.0
# ============================================================

name: React CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:
    name: Lint and Build

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # STEP 1
      # Download repository source code into the CI runner.
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 2
      # Install the Node.js runtime used for the React/Vite
      # application.
      # ------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------
      # STEP 3
      # Install exactly the dependency versions recorded in
      # package-lock.json.
      # ------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # STEP 4
      # Run ESLint and fail the CI job if linting fails.
      # ------------------------------------------------------
      - name: Run ESLint
        run: npm run lint

      # ------------------------------------------------------
      # STEP 5
      # Verify that Vite can generate the production build.
      # ------------------------------------------------------
      - name: Build application
        run: npm run build