# ============================================================
# React Weather Forecasting App
# FINAL Continuous Integration Workflow
# ============================================================
#
# Pipeline:
#
# Source Change
#     ↓
# npm ci
#     ↓
# ESLint
#     ↓
# Automated Tests
#     ↓
# Production Build
#     ↓
# Upload Build Artifact
#     ↓
# CI PASS / FAIL
#
# Author: mghazel
# Date: 01-Sep-2026
# Version: 3.0
# ============================================================

name: React CI


on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:


jobs:
  quality-checks:

    name: Lint, Test, Build and Package

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Node.js
        uses: actions/setup-node@v6

        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Run ESLint
        run: npm run lint


      - name: Run automated tests
        run: npm run test:run


      - name: Build production application
        run: npm run build


      - name: Upload production build artifact
        uses: actions/upload-artifact@v7

        with:
          name: react-weather-production-build
          path: dist/
          retention-days: 7