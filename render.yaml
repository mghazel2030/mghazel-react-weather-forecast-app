# ============================================================
# React Weather Forecasting App
# Render Static Site Blueprint
# ============================================================
#
# Deployment Model:
#
# GitHub main
#      ↓
# GitHub CI
#      ↓
# CI Checks Pass
#      ↓
# Render Build
#      ↓
# dist/
#      ↓
# Render Global Static Hosting
#
# Author: mghazel
# Date: 01-Sep-2026
# Version: 1.0
# ============================================================

services:

  - type: web

    runtime: static

    name: mghazel-react-weather-forecast-app

    branch: main

    buildCommand: npm ci && npm run build

    staticPublishPath: ./dist

    autoDeployTrigger: checksPassnpm run dev